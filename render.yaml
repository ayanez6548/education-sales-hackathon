services:
  - type: web
    name: education-sales-hackathon
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/ready
    envVars:
      - key: APP_ENV
        value: public_demo
      - key: DEMO_MODE
        value: "false"
      - key: AUTH_ADAPTER
        value: demo
      - key: EMBED_WORKER
        value: "true"
      - key: TELEGRAM_ADAPTER
        value: live
      - key: REGISTER_TELEGRAM_WEBHOOK
        value: "true"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_OPERATOR_PASSWORD
        generateValue: true
      - key: DEMO_OPERATOR_B_PASSWORD
        generateValue: true
      - key: LLM_ADAPTER
        value: openai
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: LLM_API_KEY
        sync: false
      - key: LLM_TIMEOUT_SECONDS
        value: "30"
      - key: JOB_LEASE_SECONDS
        value: "90"
      - key: DATABASE_URL
        fromDatabase:
          name: education-sales-db
          property: connectionString

databases:
  - name: education-sales-db
    plan: free
    region: oregon
    ipAllowList: []
    databaseName: education_sales
    user: education_sales
